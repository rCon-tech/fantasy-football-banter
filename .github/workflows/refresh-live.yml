name: Refresh live standings

# Once a day, check FPL. If a new gameweek has finished, commit the new standings to main.
# The commit is what Vercel (and the old GitHub Pages deploy) publish.
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch standings
        run: node scripts/fetch-live.mjs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- live.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -m "Update live standings"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy GitHub Pages copy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
