name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * *'   # daily check; new standings are only published once a gameweek has finished
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh live FPL data
        run: node scripts/fetch-live.mjs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - run: |
          mkdir _site
          cp -r index.html style.css app.js data.js echo-config.js live.json img _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
